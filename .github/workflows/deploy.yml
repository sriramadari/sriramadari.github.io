name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages has no rewrites, so give each client-side route its own copy of the app shell
      # (served with a 200), and let 404.html catch anything else.
      - name: Add route entry points
        run: |
          cp dist/index.html dist/404.html
          for route in packages $(grep -o 'slug: "[^"]*"' src/lab/packages.ts | cut -d'"' -f2 | sed 's|^|packages/|'); do
            mkdir -p "dist/$route" && cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
